{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination-wrap" aria-label="分页"><span>第 {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 页，共 {{ page_obj.paginator.count }} 条</span><div>{% if page_obj.has_previous %}<a class="page-link" href="?page={{ page_obj.previous_page_number }}">上一页</a>{% endif %}{% if page_obj.has_next %}<a class="page-link" href="?page={{ page_obj.next_page_number }}">下一页</a>{% endif %}</div></nav>{% endif %}
